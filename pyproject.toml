[project]
name = "seampact-core"
version = "0.16.5"
description = "Repository capability generation and event-driven Agent scheduling"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
rl = ["torch>=2.2", "numpy>=1.26"]
office = ["agentdojo==0.1.35", "hatchling", "editables"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
seampact = ["ui/*", "pi_host/*.mjs", "pi_host/*.json", "pi_host/README.md"]
