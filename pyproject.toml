[project]
name = "seampact-core"
version = "0.16.0"
description = "Repository capability generation and event-driven Agent scheduling"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
rl = ["torch>=2.2", "numpy>=1.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
seampact = ["ui/*"]
