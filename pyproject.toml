[project]
name = "seampact-core"
version = "0.14.0"
description = "Heterogeneous Harness intake, native Units and two-layer RL chat prototype"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
rl = ["torch>=2.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
seampact = ["ui/*"]
