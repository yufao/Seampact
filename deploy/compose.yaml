name: seampact-prototype

services:
  platform:
    image: "${SEAMPACT_PLATFORM_IMAGE:-seampact-core:local}"
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        DEPENDENCY_IMAGE: "${SEAMPACT_DEPENDENCY_IMAGE:?Run deploy/build_platform.py and pass its --compose-env file}"
        SEAMPACT_EXTRAS: "${SEAMPACT_EXTRAS:-}"
        SEAMPACT_REVISION: "${SEAMPACT_REVISION:-UNKNOWN}"
        SEAMPACT_VERSION: "${SEAMPACT_VERSION:-UNKNOWN}"
    user: "${SEAMPACT_UID:-1000}:${SEAMPACT_GID:-1000}"
    init: true
    command: [serve, --home, /data, --host, 0.0.0.0, --port, "8880", --public-port, "${SEAMPACT_PORT:-8880}"]
    environment:
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      GLM_API_KEY: "${GLM_API_KEY:-}"
      MOONSHOT_API_KEY: "${MOONSHOT_API_KEY:-}"
      SEAMPACT_CHAT_API_KEY: "${SEAMPACT_CHAT_API_KEY:-}"
      SEAMPACT_ANALYSIS_API_KEY: "${SEAMPACT_ANALYSIS_API_KEY:-}"
    ports:
      - "127.0.0.1:${SEAMPACT_PORT:-8880}:8880"
    volumes:
      - "${SEAMPACT_DATA_DIR:-../var/prototype}:/data"
      - "${SEAMPACT_HARNESS_DIR:-../harnesses}:/harnesses"
